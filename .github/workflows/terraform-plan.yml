name: Terraform plan

on:
  workflow_call:
    inputs:
      stack:
        description: Stack name; used to name the plan artifact and the PR comment.
        type: string
        required: true
      working-directory:
        description: Directory containing the stack's Terraform code.
        type: string
        required: true
      var-file:
        description: Path to the stack's .tfvars file, relative to the repository root.
        type: string
        required: true
      terraform-version:
        type: string
        default: ""
      azure-client-id:
        type: string
        required: true
      azure-tenant-id:
        type: string
        required: true
      azure-subscription-id:
        type: string
        required: true
      comment-on-pr:
        type: boolean
        default: true
    outputs:
      has-changes:
        description: '"true" if the plan contains changes.'
        value: ${{ jobs.plan.outputs.has-changes }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ inputs.azure-client-id }}
      ARM_TENANT_ID: ${{ inputs.azure-tenant-id }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      has-changes: ${{ steps.plan.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Terraform setup and init
        uses: ArisoonDt/my-workflows/.github/actions/terraform-init@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          terraform-version: ${{ inputs.terraform-version }}

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        env:
          VAR_FILE: ${{ github.workspace }}/${{ inputs.var-file }}
        run: |
          set +e
          terraform plan -no-color -input=false -lock-timeout=5m \
            -var-file="$VAR_FILE" -out=tfplan -detailed-exitcode
          code=$?
          set -e
          # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes present
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "has-changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > plan.txt

      # Only stacks with changes get an artifact; callers use its presence to decide what to apply.
      - name: Upload plan
        if: steps.plan.outputs.has-changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.stack }}
          path: |
            ${{ inputs.working-directory }}/tfplan
            ${{ inputs.working-directory }}/.terraform.lock.hcl
          include-hidden-files: true
          retention-days: 5

      - name: Comment plan on PR
        if: github.event_name == 'pull_request' && inputs.comment-on-pr
        uses: actions/github-script@v7
        env:
          STACK: ${{ inputs.stack }}
          PLAN_FILE: ${{ inputs.working-directory }}/plan.txt
          HAS_CHANGES: ${{ steps.plan.outputs.has-changes }}
        with:
          script: |
            const fs = require('fs')
            const { STACK, PLAN_FILE, HAS_CHANGES } = process.env
            const marker = `<!-- terraform-plan:${STACK} -->`
            const plan = fs.readFileSync(PLAN_FILE, 'utf8')
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n... (truncated)' : plan
            const status = HAS_CHANGES === 'true' ? 'changes detected' : 'no changes'
            const body = `${marker}\n#### Terraform plan \`${STACK}\`: ${status}\n<details><summary>Show plan</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n</details>\n\n_Updated for ${context.sha.slice(0, 7)}_`

            // Update this stack's existing comment instead of adding a new one on every push.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            })
            const existing = comments.find(c => c.body?.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              })
            }
